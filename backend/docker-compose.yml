services:
  # --- Phase 1 Edge Tunnel ---
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aegis-edge-tunnel
    restart: unless-stopped
    command: tunnel --url http://localhost:8000
    network_mode: host

  # --- Phase 3 Hardened Docker Socket Proxy ---
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: aegis-socket-proxy
    restart: unless-stopped
    volumes:
      # Mount actual host socket as Read-Only (ro)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1 # Allows container listing & telemetry reads
      - RESTART=1    # Allows POST /containers/{id}/restart for self-healing
      - POST=0       # Blocks ALL other POST operations (exec, create, build)
    ports:
      - "127.0.0.1:2375:2375"