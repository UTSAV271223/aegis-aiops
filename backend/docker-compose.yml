services:
  # --- Phase 1 Edge Tunnel ---
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aegis-edge-tunnel
    restart: unless-stopped
    command: tunnel --url http://localhost:8000
    network_mode: host

  # --- Phase 3 Hardened Docker Socket Proxy ---
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: aegis-socket-proxy
    restart: unless-stopped
    volumes:
      # Removed ':ro' to grant the proxy write access for restart commands
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - CONTAINERS=1 # Allows container listing & telemetry reads
      - POST=1       # REQUIRED: Allows POST requests (restarts)
    ports:
      - "127.0.0.1:2375:2375"